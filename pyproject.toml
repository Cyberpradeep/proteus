[project]
name = "proteus-core"
version = "0.1.0"
description = "Repository-Aware API Evolution Monitoring, Impact Analysis and Automated Repair"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "HarishKanna P", email = "23cy020@example.com" },
    { name = "Tamil Selvan S", email = "23cy050@example.com" },
    { name = "Pradeep S", email = "pradeepnaveen930@gmail.com" },
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
proteus = "proteus.cli.main:cli_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["proteus"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
